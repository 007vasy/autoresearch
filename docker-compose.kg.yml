services:
  neo4j-kg:
    image: neo4j:5-community
    container_name: autoresearch-neo4j-kg
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/autoresearch
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
    volumes:
      - neo4j-kg-data:/data
    restart: unless-stopped

volumes:
  neo4j-kg-data:
